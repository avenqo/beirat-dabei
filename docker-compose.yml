# Beirat dabei: ein Stack pro Instanz. Konfiguration über .env (siehe .env.example).
services:
  directus:
    image: directus/directus:12.5.0 # Version fest, Updates bewusst durchführen
    restart: unless-stopped
    ports:
      - "${PORT:-8055}:8055"
    volumes:
      - ./data/database:/directus/database
      - ./data/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      KEY: ${KEY}
      SECRET: ${SECRET}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TRANSPORT: smtp
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      TZ: ${TZ:-Europe/Berlin}
      TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 5s
      retries: 5
